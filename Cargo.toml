[workspace]
members = [
    "crates/egui-twoui-tokens",
    "crates/egui-twoui-icons",
    "crates/egui-twoui-widgets",
    "crates/egui-twoui-layouts",
    "crates/egui-twoui",
    "examples/showcase",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightofnoreturn/TwoUI-Crate"
authors = ["nightofnoreturn"]

[workspace.dependencies]
egui = "0.37.0"
eframe = "0.37.0"
resvg = { version = "0.50.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
egui-twoui-tokens = { path = "crates/egui-twoui-tokens", version = "0.1.0", default-features = false }
egui-twoui-icons = { path = "crates/egui-twoui-icons", version = "0.1.0" }
egui-twoui-widgets = { path = "crates/egui-twoui-widgets", version = "0.1.0", default-features = false }
egui-twoui-layouts = { path = "crates/egui-twoui-layouts", version = "0.1.0" }
egui-twoui = { path = "crates/egui-twoui", version = "0.1.0" }
