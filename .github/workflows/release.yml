name: Release Showcase Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (only used for manual dispatch)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Package Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p twoui-showcase
      - name: Package Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/win | Out-Null
          Copy-Item target/release/twoui-showcase.exe dist/win/
          Copy-Item README.md dist/win/
          Compress-Archive -Path dist/win/* -DestinationPath twoui-showcase-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: twoui-showcase-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Package Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            libssl-dev
      - name: Build release binary
        run: cargo build --release -p twoui-showcase
      - name: Package Linux archive
        run: |
          mkdir -p dist/linux
          cp target/release/twoui-showcase dist/linux/
          chmod +x dist/linux/twoui-showcase
          cp README.md dist/linux/
          tar -C dist/linux -czf twoui-showcase-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: twoui-showcase-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: TwoUI-Crate Showcase ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/twoui-showcase-windows-x86_64.zip
            release-assets/twoui-showcase-linux-x86_64.tar.gz
