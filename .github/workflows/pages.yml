name: Deploy Rustdoc & Guides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            libssl-dev
      - name: Generate workspace rustdoc
        run: cargo doc --workspace --no-deps --all-features
      - name: Add landing index
        run: |
          cat << 'EOF' > target/doc/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>TwoUI-Crate (egui-twoui) Documentation</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; background: #010102; color: #FAFAFF; margin: 0; padding: 48px 20px; }
              main { max-width: 760px; margin: 0 auto; }
              h1 { font-size: 2rem; margin-bottom: 8px; }
              p.sub { color: #A6A6AA; margin-top: 0; margin-bottom: 28px; }
              .card { background: #17171A; border-radius: 26px; padding: 20px 24px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.08); }
              .card h2 { font-size: 1.05rem; margin-top: 0; color: #5496FF; }
              ul { list-style: none; padding: 0; margin: 0; }
              li { padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.08); }
              li:first-child { border-top: none; }
              a { color: #FAFAFF; text-decoration: none; font-weight: 600; }
              a:hover { color: #5496FF; }
              span { color: #88888D; font-size: 0.9rem; margin-left: 8px; }
            </style>
          </head>
          <body>
            <main>
              <h1>TwoUI-Crate</h1>
              <p class="sub">Modular UI component crate for <code>egui 0.37.0</code></p>
              <div class="card">
                <h2>API Reference (Rustdoc)</h2>
                <ul>
                  <li><a href="egui_twoui/index.html">egui_twoui</a><span>Umbrella facade &amp; prelude</span></li>
                  <li><a href="egui_twoui_tokens/index.html">egui_twoui_tokens</a><span>Palettes, dimensions, typography &amp; motion</span></li>
                  <li><a href="egui_twoui_icons/index.html">egui_twoui_icons</a><span>SVG icons via resvg</span></li>
                  <li><a href="egui_twoui_widgets/index.html">egui_twoui_widgets</a><span>Buttons, cards, seekbars, pickers, tabs, QR</span></li>
                  <li><a href="egui_twoui_layouts/index.html">egui_twoui_layouts</a><span>TwoUiScaffold, TwoUiDrawer, dialogs, sheets</span></li>
                </ul>
              </div>
              <div class="card">
                <h2>Guides &amp; Source</h2>
                <ul>
                  <li><a href="https://github.com/nightofnoreturn/TwoUI-Crate/blob/main/docs/getting-started.md">Getting Started</a></li>
                  <li><a href="https://github.com/nightofnoreturn/TwoUI-Crate/blob/main/docs/components.md">Component Reference</a></li>
                  <li><a href="https://github.com/nightofnoreturn/TwoUI-Crate/blob/main/docs/credits.md">Credits &amp; Licenses</a></li>
                  <li><a href="https://github.com/nightofnoreturn/TwoUI-Crate/releases">Download Windows &amp; Linux Showcase Releases</a></li>
                </ul>
              </div>
            </main>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
