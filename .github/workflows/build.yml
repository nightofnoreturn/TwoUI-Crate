name: Build & Test TwoUI-Crate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Check, Test & Docs (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            libssl-dev
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Test facade without default features
        run: cargo test -p egui-twoui --no-default-features
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  build-windows:
    name: Build Showcase (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build showcase release binary
        run: cargo build --release -p twoui-showcase
      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: twoui-showcase-windows-x86_64
          path: target/release/twoui-showcase.exe
          if-no-files-found: error

  build-linux:
    name: Build Showcase (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            libssl-dev
      - name: Build showcase release binary
        run: cargo build --release -p twoui-showcase
      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: twoui-showcase-linux-x86_64
          path: target/release/twoui-showcase
          if-no-files-found: error
