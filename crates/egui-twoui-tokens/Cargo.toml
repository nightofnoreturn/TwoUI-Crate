[package]
name = "egui-twoui-tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Design tokens, light/dark palettes, variable typography, and motion helpers for egui"
keywords = ["egui", "gui", "theme", "tokens", "typography"]
categories = ["gui"]

[features]
default = ["font", "blur"]
font = []
blur = ["dep:egui_glow", "dep:glow"]

[dependencies]
egui.workspace = true
egui_glow = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
